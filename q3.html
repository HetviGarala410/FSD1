 <!-- Write down HTML/CSS code that flip an image as you move the mouse over 
the image. -->





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            border-style: solid;
            border-color: black;
            border-width: 5px;
            width: 300px;
            height: 300px;
        }

        img:hover{
            scale: -1;
        }
    </style>
</head>
<body>
    <img src="a.png">
</body>
</html>
