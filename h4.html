<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <centre>
    <form action="first.html" method="post" enctype="multipart/form-data" >
        <fieldset>
            <legend>Login form</legend>
        <label>username </label>
        <input type="text" name="username" value="LJU" readonly>
        <br>
        <label>password</label>
        <input type="password" name="pwd" ><br>
        Email:<input type="email" placeholder="name@example.com" required/> <br>
        Phone:<input type="tel" placeholder="1234567890"><br>
        mobile<input type="number"/>
        <br>
        Gender:
        <input type="radio" name="gender" value="male" checked>Male
        <input type="radio" name="gender" value="female" checked>female
        <br>
        Hobby:
        <input type="checkbox"name="c1"value="music" checked>Music
        <input type="checkbox"name="c2" value="Sports" checked>Sports
        <input type="password" minlength="6" maxlength="10"><br>
        <input type="date" name="date" min="2026-12-27" max="2026-12-31">
        <br>
        Preferred Browser:
        <input list="Browser" name="b1">
        <datalist id="Browser">
            <option value="chrome"></option>
            <option value="firefox"></option>
        </datalist><br>
        Select Branch:
        <select name="b1">
            <optgroup label="Computer">
                <option selected disabled hidden>Select branch</option>
                <option>CSE</option>
                <option>CSIT</option>
                <option>CE</option>
                <option>IT</option>
            </optgroup>
        </select>
        <br>
        Range:
        <input type="range" name="r1" min="0" max="50" step="5" value="25">
        <br><input type="hidden" name="userid" value="1234">
        <input type="submit">
        <input type="reset">
        <input type="button" value="Click Here">
        <br><input type="submit" value="Login">
        <br>Upload:
        <input type="file" name="resume" accept=".pdf, .doc" multiple>

        </fieldset>
    </form>
    </centre>
</body>
</html>
