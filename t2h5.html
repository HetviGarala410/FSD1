<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .textpro
        {
            color: red;
            text-align: left;
            text-indent: 20px;
            text-transform: uppercase;
            text-decoration: overline;
            letter-spacing: 2px;
            word-spacing: 1px;
            line-height: 1.5;
            text-shadow: 2px 3px 10px blue;
        }

        .fontpro
        {
            font-family: 'Times New Roman';
            font-style: italic;
            font-weight: bold;
            font-size: 30px;
            font-variant: small-caps;
        }

        .borderpro
        {
            border: 4px double green;
            border-radius: 20px;
        }

        .leftrightborder
        {
            border-top: 2px dashed blue;
            border-bottom: 3px dotted pink;
        }
    </style>
</head>
<body>
    <p class="textpro">hello</p>
    <p class="fontpro">hello</p>
    <p class="borderpro">hello</p>
    <p class="leftrightborder">hello</p>
</body>
</html>
