<!-- Write down HTML/CSS code that show how to create a linear gradient (from 
left to right) with the color of the rainbow and some text like "Rainbow". -->







<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 400px;
            height:400px;
            border-color: black;
            border-style: solid;
            /* text-align: center; */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            background-image: linear-gradient(to right, violet,indigo,blue,green,yellow,orange,red);
        }
    </style>
</head>
<body>
    <div>RAINBOW</div>
</body>
</html>
