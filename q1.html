 <!-- Write down HTML/CSS code that use the border property to create 
thumbnail images. -->











<!DOCTYPE html>
<html>
<head>
    <title>Thumbnail Images</title>

    <style>
        img {
            border: 2px solid #ddd;
            border-radius: 4px;
            padding: 5px;
            width: 150px;
        }
    </style>
</head>

<body>

    <h2>Thumbnail Image</h2>

    <img src="a.png" alt="Nature">

</body>
</html>
