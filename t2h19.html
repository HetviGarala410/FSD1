<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      /* Starting styles */
      width: 100px;
      height: 100px;
      background-color: coral;
      border-radius: 0px;
      
      /* Smooth transitions (Property, Duration, Delay) */
      transition: 
        width 1s, 
        height 1s, 
        background-color 5s 0.5s, /* 2 seconds long, waits 0.5 seconds */
        border-radius 6s, 
        transform 2s;
    }

    /* Styles when you hover over the box */
    .box:hover {
      width: 200px;
      height: 200px;
      background-color: blue;
      border-radius: 50%;
      transform: rotate(360deg);
    }
  </style>
</head>
<body>

  <div class="box"></div>

</body>
</html>
