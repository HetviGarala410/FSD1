<!-- Write HTML and CSS script to design one table having 3 columns and 5 
rows. Add random data. While hovering, it should be expanded around 50% 
horizontally, background-color and font color will become red and white 
respectively. Expansion should take place in 2 seconds -->





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    td{
        transition-duration: 2s;
    }
    td:hover{
        transform: scaleX(1.5);
        background-color: red;
        color: white;
    }
    </style>
</head>
<body>
    <table border="1">
        <tr>
            <td>Hii</td><td>Hello</td><td>Kemm</td>
        </tr>
        <tr>
            <td>Hii</td><td>Hello</td><td>Kemm</td>
        </tr>
        <tr>
            <td>Hii</td><td>Hello</td><td>Kemm</td>
        </tr>
        <tr>
            <td>Hii</td><td>Hello</td><td>Kemm</td>
        </tr>
        <tr>
            <td>Hii</td><td>Hello</td><td>Kemm</td>
        </tr>
    </table>
</body>
</html>
