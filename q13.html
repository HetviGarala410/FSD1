<!-- Write down HTML/CSS code to rotates the <div> element counter - 
clockwise with 20 degrees. -->








<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width:300px;
            height: 300px;
            background-color: red;
            transition-duration: 3s;
            margin: auto;
            margin-top: 200px;
        }
        div:hover{
            transform: rotate(-20deg);
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
