 <!-- Create a button that increases its width from 100px to 200px on hover in 1 
second with ease-out. -->





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Transition</title>

    <style>
        button {
            width: 100px;
            transition-duration: 1s;
            transition-timing-function: ease-out;
        }

        button:hover {
            width: 200px;
        }
    </style>
</head>
<body>

    <button>Click Me</button>

</body>
</html>
