 <!-- Write down HTML/CSS code that use the border-radius property to create 
rounded images -->






<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            border-color: black;
            border-radius: 50%;
            border-width: 5px;
            width: 200px;
            height: 200px;
            border-style:solid;
        }
    </style>
</head>
<body>
    <img src="a.png">
</body>
</html>
