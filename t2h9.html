<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .class1::first-letter

        {
            color: blue;
            font-size: 25px;
        }
        #id1::first-line
        {
            background-color: aqua;
            font-style: italic;
        }
        h1::before{
            content:"errr";
        }
        h1::after{
            content:"Happy";
            color: green;
            font-style: italic;
        }
    </style>
</head>
<body>
    <p class="class1">This is an example</p>
    <p id="id1">hellllloooooooooo</p>
    <h1>hetvi</h1>
</body>
</html>
