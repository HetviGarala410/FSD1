<!-- Write HTML/CSS code to make a circle with a conic gradient divided into 
three equal parts: red, yellow, and blue. -->







<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 400px;
            height: 400px;
            border-style: solid;
            border-color: black;
            border-radius: 50%;
            background-image: conic-gradient(red 0deg,red 120deg,yellow 120deg,yellow 240deg,blue 240deg,blue 360deg);
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
