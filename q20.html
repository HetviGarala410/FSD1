<!-- Write HTML & CSS code to design one banner using any heading tag. That 
heading should move in counter-clockwise and complete its iteration then 
return back in clockwise on its starting position. Use blue text color. And 
effect should begin after 3 second of loading page. -->




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 500px;
            width: 500px;
            background-color: bisque;
        }
        @keyframes demo{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(-360deg);
            }
        }
        h1{
            animation-name: demo;
            animation-iteration-count: infinite;
            animation-duration: 2s;
            animation-delay: 3s;
            /* animation-direction: alternate-reverse; */
            animation-direction: alternate;
            color: blue;
            margin: auto;
            padding-top: 250px;
        }
    </style>
</head>
<body><div class="container">
    <h1>Jay Shree Krishna</h1></div>
</body>
</html>
