<!-- Write HTML & CSS code to design one <div> tag which grows in size while 
rotating 1200 degrees with 2 different background color and again back to its 
original size and background color. An effect should begin after 3 second of 
loading page and it is continuing forever. -->






<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes demo{
            0%{
                background-color: pink;
                transform: rotate(0deg);
            }
            50%{
                background-color: blue;
                transform: rotate(1200deg) scale(2);
            }
            100%{
                background-color: pink;
                transform: rotate(0deg);
            }
        }
        div{
            width: 100px;
            height: 100px;
            animation-name: demo;
            animation-duration: 2s;
            animation-delay: 3s;
            margin:auto;
            margin-top: 300px;
            animation-iteration-count: infinite;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
