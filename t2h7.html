<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1
        {
            width: 900px;
            height: 500px;
            margin:  auto;
            padding: 20px;
            border: 4px solid teal;
            box-sizing: content-box;
            box-shadow: 5px 5px 15px gray;
            background-color: burlywood;
            text-align: center;
            background-image: url(img3.png);
            
            background-size:cover;
            background-repeat:repeat;
        }

        .box2
            {
            width: 300px;
            height: 150px;
            margin: 30px auto;
            padding: 20px;
            border: 4px solid teal;
            box-sizing: border-box;
            box-shadow: 5px 5px 15px gray;
            background-color: rgb(119, 54, 54);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box1">Box with content content box</div>
    <div class="box2">Box with content border box</div>
</body>
</html>
