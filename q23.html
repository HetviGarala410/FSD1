<!-- Write HTML & CSS to make a div change its background color from red to 
yellow in 3 seconds when hovered, using ease-in timing. -->




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 400px;
            height: 400px;
            background-color: red;
            transition-duration: 3s;
            transition-timing-function: ease-in;
        }
        div:hover{
            background-color: yellow;
        }

    </style>
</head>
<body>
    <div></div>
</body>
</html>
