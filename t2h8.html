<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link
        {
            color: red;
        }
        a:visited
        {
            color: green;
        }
        a:active
        {
            color: blue;
        }
        h1{
            height: 100px;
            width: 1000px;
            border: 3px solid red;
        }
        h1:hover{
            height: 400px;
            width:300px;
            background-color: aqua;

        }
    </style>
</head>
<body>
    <a href="http://www.google.com" target="_blank">
        Click here
    </a>
    <h1>
        apply hear pseudo class effect</h1>
    </h1>
</body>
</html>
