<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External CSS Example</title>
   
    <style>
    h1, h2, h3, h4, h5, h6 {
        font-weight: normal;
        font-size: 150%;}


    p {
        font-family: Arial, sans-serif;
        font-weight: bold;
    }

    </style>
</head>
<body>

    <h1>This is a Header 1</h1>
    <h2>This is a Header 2</h2>

    <p>This is a paragraph displayed in Arial font with a bold style.</p>
    <p>This is a second paragraph showing the same styling rule applied automatically.</p>

</body>
</html>
