<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 400px;
            width: 400px;
            background-image: linear-gradient(to top left,red,rgb(243, 121, 7),rgb(255, 0, 179),rgb(195, 0, 255));
        }
        h1{
            height: 400px;
            width: 400px;
            background-image: linear-gradient(to bottom,rgb(255, 136, 0),rgb(253, 253, 253),rgb(1, 117, 10));
        }
        h2{
            height: 400px;
            width: 400px;
            background-image: radial-gradient(circle,red,rgb(243, 121, 7),rgb(255, 0, 179),rgb(195, 0, 255));
        
        }
        h3{
            height: 400px;
            width: 400px;
            background-image: conic-gradient(from 90deg,red,rgb(243, 121, 7),rgb(255, 0, 179),rgb(195, 0, 255));
        }
    </style>
</head>
<body>
    <div></div>
   <h1></h1>
   <h2></h2>
   <h3></h3>
</body>
</html>
