<!-- Write down HTML/CSS code to increases the <div> element to be two times 
of its original width, and five times of its original height -->








<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            background-color: pink;
            transition-duration: 3s;
        }
        div:hover{
            transform: scale(2,5);
            background-color: hotpink;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
