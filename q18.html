<!-- Write HTML and CSS code to animate a square that moves up and down 
continuously, with the animation running forever in alternate direction. -->





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes demo{
            from{
                transform: translateY(0px);
                /* position: absolute;
                top: 40px;
                left:100px */
            }
            to{
                transform: translateY(300px);
            }
        }
        div{
            width: 150px;
            height: 150px;
            animation-name: demo;
            animation-duration: 2s;
            background-color: orange;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-timing-function: ease-in-out;
        }
    </style>
</head>
<body>
    <div>
    </div>
</body>
</html>
